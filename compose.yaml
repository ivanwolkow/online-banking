services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: online_banking
      POSTGRES_USER: online_banking
      POSTGRES_PASSWORD: online_banking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_banking -d online_banking"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/online_banking
      DB_USERNAME: online_banking
      DB_PASSWORD: online_banking
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docs}
      JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    ports:
      - "8080:8080"
volumes:
  postgres-data:
